name: Skill policy tests

on:
  pull_request:
    paths:
      - "issue/**"
      - "issue-fixer/**"
      - "verify/**"
      - "issue-followup/**"
      - "ci-fixer/**"
      - "pr-auto/**"
      - "pr-reconciliation/**"
      - "test-gut-check/**"
      - "test-gut-check-batch/**"
      - "coverage-risk/**"
      - "cto-reflection/**"
      - "plugins/github-coding-agent-skills/**"
      - ".agents/plugins/marketplace.json"
      - "tools/sync_marketplace_plugin.py"
      - ".github/workflows/pr-auto-policy.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "issue/**"
      - "issue-fixer/**"
      - "verify/**"
      - "issue-followup/**"
      - "ci-fixer/**"
      - "pr-auto/**"
      - "pr-reconciliation/**"
      - "test-gut-check/**"
      - "test-gut-check-batch/**"
      - "coverage-risk/**"
      - "cto-reflection/**"
      - "plugins/github-coding-agent-skills/**"
      - ".agents/plugins/marketplace.json"
      - "tools/sync_marketplace_plugin.py"
      - ".github/workflows/pr-auto-policy.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ChatGPT marketplace mirror
        run: python3 tools/sync_marketplace_plugin.py --check

      - name: Check skill source diagnostic
        run: python3 -m py_compile tools/diagnose_skill_sources.py

      - name: Run all deterministic skill tests
        shell: bash
        run: |
          set -euo pipefail
          for dir in issue verify issue-followup ci-fixer pr-auto test-gut-check test-gut-check-batch coverage-risk cto-reflection; do
            echo "==> $dir"
            python3 -m unittest discover -s "$dir/scripts" -p "test_*.py" -v
          done
          bash pr-reconciliation/scripts/test-reconcile-open-prs.sh
