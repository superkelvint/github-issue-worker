name: Skill policy tests

on:
  pull_request:
    paths:
      - "issue/**"
      - "verify/**"
      - "issue-followup/**"
      - "ci-fixer/**"
      - "pr-auto/**"
      - "test-gut-check/**"
      - "test-gut-check-batch/**"
      - "cto-reflection/**"
      - ".github/workflows/pr-auto-policy.yml"
  push:
    branches:
      - main
    paths:
      - "issue/**"
      - "verify/**"
      - "issue-followup/**"
      - "ci-fixer/**"
      - "pr-auto/**"
      - "test-gut-check/**"
      - "test-gut-check-batch/**"
      - "cto-reflection/**"
      - ".github/workflows/pr-auto-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all deterministic skill tests
        shell: bash
        run: |
          set -euo pipefail
          for dir in issue verify issue-followup ci-fixer pr-auto test-gut-check test-gut-check-batch cto-reflection; do
            echo "==> $dir"
            python3 -m unittest discover -s "$dir/scripts" -p "test_*.py" -v
          done
