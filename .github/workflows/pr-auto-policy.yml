name: Skill policy tests

on:
  pull_request:
    paths:
      - "skills/**"
      - "plugin.json"
      - ".agents/plugins/marketplace.json"
      - "tools/*.py"
      - ".github/workflows/pr-auto-policy.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "plugin.json"
      - ".agents/plugins/marketplace.json"
      - "tools/*.py"
      - ".github/workflows/pr-auto-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify single canonical skill tree
        run: python3 tools/check_skill_layout.py

      - name: Test skill layout validator
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Check skill source diagnostic
        run: python3 -m py_compile tools/diagnose_skill_sources.py

      - name: Run all deterministic skill tests
        shell: bash
        run: |
          set -euo pipefail
          for dir in issue verify issue-followup ci-fixer pr-auto test-gut-check test-gut-check-batch coverage-risk cto-reflection; do
            echo "==> $dir"
            python3 -m unittest discover -s "skills/$dir/scripts" -p "test_*.py" -v
          done
          bash skills/pr-reconciliation/scripts/test-reconcile-open-prs.sh
