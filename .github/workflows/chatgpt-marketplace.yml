name: ChatGPT marketplace package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  marketplace-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated plugin mirror
        run: python3 tools/sync_marketplace_plugin.py --check
